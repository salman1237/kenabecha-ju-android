# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
# AGP 9's new "built-in Kotlin" mode conflicts with how the KSP Gradle
# plugin (used for Hilt's annotation processing) currently registers its
# generated-sources directories via the legacy kotlin.sourceSets DSL. This
# is Gradle's own documented escape hatch (named directly in the resulting
# error) until KSP publishes a build-in-Kotlin-aware release. Proven fix,
# carried over from the KenaBecha team's other Android app on this same
# toolchain (AGP 9.3.2 / Kotlin 2.2.10).
android.disallowKotlinSourceSets=false
